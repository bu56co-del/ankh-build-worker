[package]
name = "ankh-capsule-crypt"
version = "1.0.0"
edition = "2021"
publish = false

[[bin]]
name = "ankh-capsule-crypt"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
chacha20poly1305 = "=0.10.1"
